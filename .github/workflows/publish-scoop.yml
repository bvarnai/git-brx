name: Publish to Scoop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish to Scoop (e.g. v1.0.0)'
        required: false
        type: string

jobs:
  update-bucket:
    name: Update Scoop Bucket
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Scoop Bucket
        uses: actions/checkout@v4
        with:
          repository: bvarnai/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_PAT }}
          path: scoop-bucket

      - name: Update Scoop Manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"

          if [[ -z "$TAG_NAME" ]]; then
            echo "Error: Tag name could not be determined. Provide a tag name if running manually."
            exit 1
          fi

          echo "Processing Scoop publication for tag: $TAG_NAME"

          # Fetch assets metadata for this release
          ASSETS=$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json assets --jq '.assets[]')

          # Locate Windows x64 and arm64 archive URLs and checksum URLs
          X64_ZIP_URL=$(echo "$ASSETS" | jq -r 'select(.name | endswith("windows_amd64.zip")) | .url')
          X64_SHA_URL=$(echo "$ASSETS" | jq -r 'select(.name | endswith("windows_amd64.zip.sha256")) | .url')

          ARM64_ZIP_URL=$(echo "$ASSETS" | jq -r 'select(.name | endswith("windows_arm64.zip")) | .url')
          ARM64_SHA_URL=$(echo "$ASSETS" | jq -r 'select(.name | endswith("windows_arm64.zip.sha256")) | .url')

          if [[ -z "$X64_ZIP_URL" || -z "$X64_SHA_URL" ]]; then
            echo "Error: Could not find Windows amd64 zip or sha256 assets in release $TAG_NAME."
            exit 1
          fi

          echo "Downloading x64 SHA256 from $X64_SHA_URL..."
          curl -fL -s "$X64_SHA_URL" -o x64.sha256
          X64_HASH=$(awk '{print $1}' x64.sha256)
          echo "Extracted x64 hash: $X64_HASH"

          ARM64_HASH=""
          if [[ -n "$ARM64_SHA_URL" ]]; then
            echo "Downloading arm64 SHA256 from $ARM64_SHA_URL..."
            curl -fL -s "$ARM64_SHA_URL" -o arm64.sha256
            ARM64_HASH=$(awk '{print $1}' arm64.sha256)
            echo "Extracted arm64 hash: $ARM64_HASH"
          fi

          # Strip leading 'v' for standard Scoop versioning (e.g. v1.0.0 -> 1.0.0)
          VERSION="${TAG_NAME#v}"
          echo "Target Scoop version: $VERSION"

          MANIFEST="scoop-bucket/bucket/git-brx.json"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "Error: Manifest $MANIFEST does not exist in scoop-bucket repository."
            exit 1
          fi

          # Update the manifest JSON fields
          if [[ -n "$ARM64_ZIP_URL" && -n "$ARM64_HASH" ]]; then
            jq --arg ver "$VERSION" \
               --arg x64_url "$X64_ZIP_URL" \
               --arg x64_hash "$X64_HASH" \
               --arg arm64_url "$ARM64_ZIP_URL" \
               --arg arm64_hash "$ARM64_HASH" \
               '.version = $ver |
                .architecture["64bit"].url = $x64_url |
                .architecture["64bit"].hash = $x64_hash |
                .architecture["arm64"].url = $arm64_url |
                .architecture["arm64"].hash = $arm64_hash' \
               "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
          else
            jq --arg ver "$VERSION" \
               --arg x64_url "$X64_ZIP_URL" \
               --arg x64_hash "$X64_HASH" \
               '.version = $ver |
                .architecture["64bit"].url = $x64_url |
                .architecture["64bit"].hash = $x64_hash' \
               "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
          fi

          echo "Updated manifest content:"
          cat "$MANIFEST"

      - name: Commit and Push to Scoop Bucket
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"
          VERSION="${TAG_NAME#v}"

          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/git-brx.json
          git commit -m "git-brx: Update to version $VERSION ($TAG_NAME)" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_PAT }}
