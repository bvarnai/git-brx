<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Clean Modern Slate Background Gradient -->
    <linearGradient id="bgSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Git Orange Gradient -->
    <linearGradient id="gitOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a3d" />
      <stop offset="100%" stop-color="#f05032" />
    </linearGradient>

    <!-- Guardrail Cyan Accent Gradient -->
    <linearGradient id="guardCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle / Shield Container (GitHub Dark Palette) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgSlate)" stroke="#30363d" stroke-width="8" />
  <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="#21262d" stroke-width="3" />

  <!-- Protective Brake / Guardrail Brackets [  ] -->
  <g fill="none" stroke="url(#guardCyan)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Guardrail Arc -->
    <path d="M 132 108 A 180 180 0 0 0 132 344" />
    <!-- Right Guardrail Arc -->
    <path d="M 380 108 A 180 180 0 0 1 380 344" />
  </g>

  <!-- Crisp Geometric Git Branch & Rebase/Merge Lifecycle Graph -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Branch Trunk (Left, x=206) -->
    <line x1="206" y1="108" x2="206" y2="344" stroke="url(#gitOrange)" stroke-width="22" />

    <!-- Topic Branch Fork & Merge Back (Right, x=306) -->
    <path d="M 206 300 C 206 250, 306 266, 306 218 L 306 194 C 306 146, 206 162, 206 116" stroke="url(#gitOrange)" stroke-width="22" />

    <!-- Commit Nodes -->
    <!-- Base Commit -->
    <circle cx="206" cy="306" r="24" fill="#0d1117" stroke="#f05032" stroke-width="16" />
    <!-- Topic Commit -->
    <circle cx="306" cy="206" r="24" fill="#0d1117" stroke="#ff6a3d" stroke-width="16" />
    <!-- Merged Head Commit -->
    <circle cx="206" cy="116" r="24" fill="#0d1117" stroke="#ff6a3d" stroke-width="16" />
  </g>

  <!-- Crisp Vector "BRX" Monogram Pill at Bottom -->
  <rect x="152" y="378" width="208" height="72" rx="36" fill="#161b22" stroke="#30363d" stroke-width="4" />
  <g fill="none" stroke="#f0f6fc" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- B -->
    <path d="M 188 394 L 188 434 L 210 434 C 218 434, 222 429, 222 424 C 222 418, 218 414, 210 414 L 188 414 M 188 394 L 208 394 C 216 394, 220 398, 220 404 C 220 410, 216 414, 208 414" />
    <!-- R -->
    <path d="M 242 434 L 242 394 L 264 394 C 272 394, 276 399, 276 405 C 276 411, 272 416, 264 416 L 242 416 M 260 416 L 276 434" />
    <!-- X (in Git Orange) -->
    <path d="M 296 394 L 324 434 M 324 394 L 296 434" stroke="#ff6a3d" />
  </g>
</svg>
