<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cylindrical Button Radial Lighting -->
    <radialGradient id="btnRimShade" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#2d3138" />
      <stop offset="65%" stop-color="#181a1f" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </radialGradient>

    <!-- Recessed Stepped Rings -->
    <linearGradient id="grooveDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050607" />
      <stop offset="100%" stop-color="#16181d" />
    </linearGradient>

    <!-- Cap Face Gradient -->
    <radialGradient id="capFace" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#252930" />
      <stop offset="72%" stop-color="#15171b" />
      <stop offset="100%" stop-color="#0d0e11" />
    </radialGradient>

    <!-- Deep Drop Shadow for Standalone Circular App/Logo Bounds -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Neon Glow Stack -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .led-glow {
      stroke: #ff4714;
      fill: none;
      stroke-linecap: round;
      filter: url(#neonGlow);
      opacity: 0.95;
    }
    .led-core {
      stroke: #ffa688;
      fill: none;
      stroke-linecap: round;
      filter: url(#coreGlow);
    }
    .txt-glow {
      font-family: ui-monospace, SFMono-Regular, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 50px;
      letter-spacing: 4px;
      text-anchor: middle;
      dominant-baseline: central;
      fill: #ff440a;
      filter: url(#neonGlow);
    }
    .txt-core {
      font-family: ui-monospace, SFMono-Regular, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 50px;
      letter-spacing: 4px;
      text-anchor: middle;
      dominant-baseline: central;
      fill: #ffd1c2;
      filter: url(#coreGlow);
    }
  </style>

  <!-- Self-Contained Circular Base Assembly with Edge Roll-off -->
  <g filter="url(#logoShadow)">
    <!-- Base Outer Edge (R=236) -->
    <circle cx="256" cy="256" r="236" fill="url(#btnRimShade)" stroke="#0b0c0e" stroke-width="3" />
    
    <!-- Outer Inset Bevel -->
    <circle cx="256" cy="256" r="218" fill="url(#grooveDark)" stroke="#1a1c22" stroke-width="1.5" />
    <circle cx="256" cy="256" r="202" fill="#0c0d10" stroke="#000000" stroke-width="3" />

    <!-- Intermediate Stepped Rim Structure -->
    <circle cx="256" cy="256" r="184" fill="url(#btnRimShade)" stroke="#07080a" stroke-width="2" />
    <circle cx="256" cy="256" r="170" fill="#0a0b0d" stroke="#1f2228" stroke-width="1" />

    <!-- Raised Center Core Cap -->
    <circle cx="256" cy="256" r="158" fill="url(#capFace)" stroke="#2d323a" stroke-width="2" />
  </g>

  <!-- Ambient Internal Spill Reflection -->
  <circle cx="256" cy="256" r="88" stroke="#ff3800" stroke-width="28" fill="none" opacity="0.12" filter="url(#neonGlow)" />

  <!-- Caliper Arcs (Radius 124, span: ~90 deg symmetrically) -->
  <g>
    <!-- Diffuse Glow -->
    <path d="M 161 176.3 A 124 124 0 0 0 161 335.7" class="led-glow" stroke-width="15" />
    <path d="M 351 176.3 A 124 124 0 0 1 351 335.7" class="led-glow" stroke-width="15" />

    <!-- Sharp Center Line -->
    <path d="M 161 176.3 A 124 124 0 0 0 161 335.7" class="led-core" stroke-width="6.5" />
    <path d="M 351 176.3 A 124 124 0 0 1 351 335.7" class="led-core" stroke-width="6.5" />
  </g>

  <!-- Central Indicator Ring -->
  <circle cx="256" cy="256" r="88" class="led-glow" stroke-width="15" />
  <circle cx="256" cy="256" r="88" class="led-core" stroke-width="6.5" />

  <!-- Central "BRX" Inscription -->
  <text x="258" y="257" class="txt-glow">BRX</text>
  <text x="258" y="257" class="txt-core">BRX</text>
</svg>
